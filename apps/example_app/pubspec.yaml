name: example_app
description: Sample app demonstrating monorepo package consumption.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  logger:
    path: ../../packages/logger

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  shared_preferences: ^2.3.0

flutter:
  uses-material-design: true
